# Fan status in the tmux status bar.
#
# Reads the line published by noctua-fan.py on tmpfs, so a refresh costs a
# cat rather than a vcgencmd process spawn. The script already reports the
# CPU temperature, so vcgencmd measure_temp is dropped to avoid showing it
# twice.
#
# status-right-length must be raised: the default is 40, and hostname plus
# the fan reading exceeds it. tmux truncates past that without warning.

set -g status-interval 2
set -g status-right-length 60
set -g status-right "#(uname -n) #(cat /run/noctua-fan/status 2>/dev/null || echo n/a)"
